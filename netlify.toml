[build]
  # QURILISH BUYRUG'I (V147) — izohlarni olib tashlaydi.
  #
  # NEGA. Kod ichidagi izohlar loyihaning eng qimmatli qismi, lekin
  # ular mijozning telefoniga ham yuklanadi. O'lchov: izohlar
  # yuklanadigan hajmning 30% ini egallaydi (368 KB -> 257 KB).
  #
  # Shu buyruq OMBORDAGI fayllarga TEGMAYDI — faqat Netlify'ning
  # vaqtinchalik nusxasida ishlaydi. Ya'ni GitHub'da izohlar to'liq
  # qoladi, mijozga esa qisqartirilgani boradi.
  #
  # XAVFSIZ: skript hech qachon deployni to'xtatmaydi. Biror fayl
  # bilan muammo bo'lsa, u fayl o'z holicha qoladi.
  # Batafsil: tools/qisqartir.js
  command = "node tools/qisqartir.js"
  # ==================================================================
  # BUILD DAQIQALARINI TEJASH (V139)
  # ------------------------------------------------------------------
  # TOPILGAN MUAMMO. Bu yerda `command = "npm install"` turardi.
  # Netlify esa `package.json` ni ko'rsa, kutubxonalarni BUYRUQDAN
  # OLDIN, O'ZI o'rnatadi. Ya'ni o'rnatish IKKI MARTA bajarilardi:
  # avval Netlify, keyin yana shu buyruq.
  #
  # Bu arzimas narsa emas: ro'yxatda firebase-admin va @resvg/resvg-js
  # kabi og'ir kutubxonalar bor (resvg'da native fayllar). Har bir
  # yuklash (commit) yangi build boshlaydi, va bepul tarifda oyiga
  # atigi 300 daqiqa beriladi — shu sabab daqiqalar tez tugab qoldi.
  #
  # Endi buyruq olib tashlandi. Netlify kutubxonalarni baribir
  # o'rnatadi va funksiyalarni yig'adi — ya'ni sayt avvalgidek
  # ishlaydi, faqat har build ikki barobar tez tugaydi.
  #
  # QO'SHIMCHA MASLAHAT: GitHub'ga fayllarni BITTA commit bilan
  # yuklash ham tejaydi — har bir "Commit changes" alohida build
  # boshlaydi. Uchta qismni ketma-ket yuklaganda uchta build ketadi.
  # ==================================================================
  publish = "."


# QO'SHIMCHA HIMOYA QATLAMI (2-eshik): admin panelga (panel-boshqaruv.html)
# kirishdan OLDIN, HTTP darajasida alohida login/parol so'raladi — batafsili
# izoh va sozlash yo'riqnomasi: netlify/edge-functions/admin-gate.js
[[edge_functions]]
  path = "/panel-boshqaruv.html"
  function = "admin-gate"

[functions]
  directory = "netlify/functions"
  # pdfkit shrift fayllari (.afm) — bular bo'lmasa PDF generatsiya funksiyalari
  # (shartnoma yuklab olish) xato beradi. Bu Netlify'da pdfkit ishlatishning
  # mashhur "tuzog'i" — shrift fayllari avtomatik bog'lanmaydi (bundle),
  # shu sabab bu yerda ANIQ ko'rsatib qo'yamiz.
  # index.html — seo-number.js funksiyasi uni o'qib, har bir raqam uchun
  # <title>/tavsif/OG teglarni almashtiradi. Bu yerda ANIQ ko'rsatilmasa,
  # Netlify uni funksiya paketiga qo'shmaydi va /raqam/... sahifalari
  # bosh sahifaga yo'naltirilib qolardi.
  included_files = ["node_modules/pdfkit/js/data/*.afm", "index.html"]

[functions."seo-number"]
  # Raqam sahifalari — Google va ijtimoiy tarmoq botlari uchun
  included_files = ["index.html"]

[functions."seo-toifa"]
  # Toifa sahifalari (operator / narx / naqsh) — ular ham index.html ni o'qiydi
  included_files = ["index.html"]

# ULASHISH KARTOCHKASI — raqam rasmi. Shriftlar funksiyaning O'ZI ichida
# (base64) saqlanadi, shu sabab included_files kerak emas.
[functions."og-raqam"]
  node_bundler = "esbuild"
  external_node_modules = ["@resvg/resvg-js"]

# RAQAM TO'LOVI — eslatmalar. Har 5 daqiqada tekshiradi, chunki har
# raqam uchun eslatma VAQTI alohida belgilanadi (masalan 08:00, 10:30) —
# soatiga bir marta tekshirilsa, belgilangan vaqtdan ancha kech ketardi.
[functions."tolov-eslatma-background"]
  # V144 — KREDIT TEJASH: */5 * * * * -> */30 * * * *
  #    Eslatma kunning belgilangan vaqtida yuboriladi — bu funksiya
  #    shunchaki "vaqti keldimi" deb qarab turadi. 30 daqiqalik
  #    aniqlik yetarli.
  schedule = "*/30 * * * *"

[functions."check-credit-payments"]
  schedule = "0 */6 * * *"

[functions."credit-excel-report"]
  schedule = "0 4 * * *"

[functions."personal-bot-reminder-check"]
  # V144 — KREDIT TEJASH: */5 * * * * -> */30 * * * *
  #    Yuqoridagi bilan bir xil sabab.
  schedule = "*/30 * * * *"

# BEELINE — kamyob toifalarni (Bronze/Silver/Gold) fonda yig'ib keshlash.
#
# NEGA: Beeline ochiq API'sining javob vaqti kategoriyadagi raqam soniga
# TESKARI bog'liq (raqam kam bo'lsa — butun bazani skanerlab uzoq qidiradi).
# O'lchangan: Oddiy 0.3-0.5s, Bronze ~3s, Gold ~5s, Silver 8-9s. To'rtala
# toifani jonli so'rash 14-17 soniya oladi (ochiq API parallel so'rovni
# ko'tarmaydi — 4 ta bir vaqtda yuborilsa "JWT token invalid" qaytadi).
#
# Shu sabab uchta KAMYOB toifa shu yerda, fonda yig'iladi; mijoz qidirganda
# ular keshdan bir zumda beriladi. "Oddiy" keshlanmaydi — u allaqachon tez
# va hajmi juda katta (~36 000 raqam, Firestore 1 MB limitiga sig'maydi).
#
# Natija (o'lchangan): jonli qidiruv 14 192 ms -> 359 ms.
#
# "-background" qo'shimchasi MAJBURIY: sinxronizatsiya ~80 soniya davom
# etadi (300 so'rov), oddiy funksiya limiti esa 10 soniya. Background
# funksiyalarga Netlify 15 daqiqagacha ruxsat beradi.
#
# Har 10 daqiqada: raqamlar bazasi tez-tez o'zgarmaydi, lekin sotilgan
# raqam keshda uzoq qolib ketmasligi kerak.
#
# ESKI sync-beeline.js (dilerlik/RMS login orqali) fayli loyihadan
# OLIB TASHLANDI (yangi, login talab qilmaydigan "ochiq" API bilan
# almashtirildi — qarang: lib/operators.js). Nusxasi "qoshimcha/
# ishlatilmaydi/" papkasida saqlanadi, kerak bo'lib qolsa deb.
[functions."sync-beeline-background"]
  # V144 — KREDIT TEJASH: */10 * * * * -> 0 * * * *
  #    Operator katalogi soatiga bir marta yangilansa yetarli.
  schedule = "0 * * * *"

[functions."personal-bot-evening-reminder"]
  schedule = "0 18 * * *"

[functions."personal-bot-morning-pdf"]
  schedule = "0 0 * * *"

[functions."personal-bot-weekly-report"]
  schedule = "0 2 * * 1"

[functions."personal-bot-monthly-report"]
  schedule = "0 2 1 * *"

[functions."personal-bot-recurring-check"]
  schedule = "0 2 * * *"

[functions."personal-bot-anomaly-check"]
  schedule = "0 16 * * *"

# TARIF MUDDATI — har kuni 04:40 (UTC) da bir marta tekshiradi:
# tugashiga 3 kun qolganlarni ogohlantiradi, tugaganlarining
# toifalarini (VIP/Premium/Gold/Mashhur) avtomatik o'chiradi.
# Batafsil izoh funksiya faylida.
[functions."tarif-muddat-background"]
  schedule = "40 4 * * *"

# XAVFSIZLIK: buyurtmasiz, soxta "band qilingan" raqamlarni har 10
# daqiqada avtomatik bo'shatadi (batafsili izoh funksiya faylida).
[functions."release-stale-reservations"]
  schedule = "*/10 * * * *"

# "Baza raqam" kuzatuvi — admin bazadan tanlagan raqamni operatorda
# muntazam qidirib turadi (batafsili izoh funksiya faylida). Har daqiqada
# ishga tushadi, lekin har bir kuzatuv faqat O'ZINING vaqti kelganda
# haqiqatan tekshiriladi (1 daqiqa / 3 daqiqa / ... / 2 soat).
# BAZANING KUNLIK ZAXIRA NUSXASI — har kuni 03:10 (UTC).
# Nega kerak: butun tovar/buyurtma/moliya bitta bazada; xato bilan
# o'chirilsa qaytarib bo'lmaydi. Batafsil: netlify/functions/zaxira-background.js
[functions."zaxira-background"]
  schedule = "10 3 * * *"

# TIZIM SOG'LIG'I — soatiga bir marta. "Jim to'xtab qolgan" ishlarni
# (sinxronizatsiya, kuzatuv, indeks, zaxira) payqab, Telegram'ga xabar
# beradi. Batafsil: netlify/functions/soglik-background.js
[functions."soglik-background"]
  # V144 — KREDIT TEJASH: 25 * * * * -> 25 */6 * * *
  #    Operatorlar sog'ligi tekshiruvi — 6 soatda bir marta.
  #    Nosozlik xabari baribir kuniga bir marta keladi (V135).
  schedule = "25 */6 * * *"

[functions."number-watch-check-background"]
  # V153 — HAR DAQIQAGA QAYTARILDI (*/10 -> * * * * *).
  #
  #   V144 da kredit tejash uchun 10 daqiqaga chiqarilgan edi va o'shanda
  #   "10 daqiqada bilish yetarli" deb yozilgandi. AMALDA YETARLI EMAS
  #   ekan: mijoz aytdi — "raqam ochilib sotilib ketyapti, lekin ochildi
  #   deb xabar kelgani yo'q". Bo'shagan VIP raqam bir necha daqiqada
  #   ketadi, demak 10 daqiqalik oyna — o'tkazib yuborilgan savdo.
  #
  #   Bu funksiyaning butun mantig'i ham HAR DAQIQA ishlashga mo'ljallab
  #   yozilgan (qarang: funksiya ichidagi V110 izohi — operatorga har bir
  #   kuzatuv uchun emas, BITTA keng so'rov yuboriladi, shuning uchun
  #   tez-tez tekshirish qimmatga tushmaydi).
  #
  #   KREDIT: Netlify funksiya CHAQIRUVINI alohida hisoblamaydi, faqat
  #   ishlagan vaqtini (GB-soat) hisoblaydi. Bu funksiya kuzatuv bo'lmasa
  #   darhol chiqib ketadi, bor bo'lsa bir necha soniya ishlaydi.
  schedule = "* * * * *"

# UZEX auksion kuzatuvi — admin AI yordamchiga "shu raqam/shartlar
# chiqsa aytib ber" deyilganda yaratilgan kuzatuvlarni tekshiradi
# (batafsili izoh funksiya faylida). UZEX tashqi API'siga kam-kam
# murojaat qilish uchun har 10 daqiqada ishga tushadi (kuzatuvning o'zi
# ham o'z intervaliga qarab, tez-tez emas, navbat bilan tekshiriladi).
[functions."uzex-watch-check-background"]
  # V144 — KREDIT TEJASH: */10 * * * * -> */30 * * * *
  #    Auksion kuzatuvi — 30 daqiqa.
  schedule = "*/30 * * * *"

# Saqlangan UZEX raqamlari — savdo tugashiga 3 soat va 1 soat qolganda
# Telegram orqali ogohlantiradi (batafsili izoh funksiya faylida). Har
# 5 daqiqada tekshiradi — bu darajadagi aniqlik yetarli.
[functions."uzex-saved-expiry-check-background"]
  # V144 — KREDIT TEJASH: */5 * * * * -> 0 * * * *
  #    Saqlangan auksion e'lonining muddati tugashi — kunlik hodisa,
  #    soatiga bir marta tekshirish yetarli.
  schedule = "0 * * * *"

# "Vazifalar" (admin dedlayn) kuzatuvi — tugashiga 5 soatdan kam qolgan
# va hali bajarilmagan har bir vazifa uchun Telegram orqali BIR MARTA
# ogohlantirish yuboradi (panel yopiq bo'lsa ham). Har 5 daqiqada tekshi-
# radi — bu darajadagi aniqlik yetarli (soatlik dedlaynlar uchun ham).
[functions."admin-tasks-check-background"]
  # V144 — KREDIT TEJASH: */5 * * * * -> */30 * * * *
  #    Vazifa dedlayni ogohlantirishi — 30 daqiqalik aniqlik yetarli.
  schedule = "*/30 * * * *"

# HAVOLANI ILOVADA OCHISH (deep link) uchun kerakli fayllar.
# Apple "apple-app-site-association" faylini FAQAT "application/json"
# turida berilgan bo'lsa qabul qiladi — faylning kengaytmasi yo'q, shu
# sabab turini shu yerda ANIQ ko'rsatish shart. Batafsil izoh:
# .well-known/README-OQING.txt
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# Service worker (oflayn rejim) — HECH QACHON keshlanmasin, aks holda
# brauzer eski sw.js ni ushlab qolib, saytning yangi versiyasi
# foydalanuvchiga yetib bormay qoladi.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# HTML sahifalar hech qachon ESKI (keshlangan, tekshirilmagan) nusxada
# ko'rsatilmasin — brauzer har doim serverdan eng yangi versiyani
# tasdiqlab oladi. "no-store" ATAYLAB qo'yilmagan — u orqaga/oldinga
# tugmalari va sahifalar orasida o'tishni "qattiq" qilib, ochiq turgan
# oynalar/holatni yo'qotib yuborar edi (mijozlar buni "sayt o'zi ochilib
# ketyapti" deb tushungan edi).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Rasm/logo kabi statik fayllar tez yuklanishi uchun keshlansa bo'ladi —
# ular kamdan-kam o'zgaradi.
# Shriftlar — nomi hech qachon o'zgarmaydi, mazmuni ham. Bir yilga
# keshlanadi: mijoz saytga ikkinchi marta kirganda umuman qayta
# yuklamaydi.

# ADMIN PANELNING USLUB va MANTIQ fayllari — BIR YILGA keshlanadi.
#
# Ular ilgari panel-boshqaruv.html ICHIDA edi (254 KB uslub + 483 KB
# mantiq) va panel HAR ochilganda qaytadan yuklanardi — telefonda,
# ayniqsa iPhone'da, sezilarli kechikish shundan edi. HTML esa
# keshlanmaydi (unda "no-cache" turibdi, va shunday bo'lishi kerak:
# yangi versiya darhol yetib borsin).
#
# Endi bu ikki fayl alohida va "immutable" bilan keshlanadi: brauzer
# ularni BIR MARTA yuklaydi, keyin diskdan oladi. Ikkinchi ochilishda
# 737 KB umuman yuklanmaydi, ustiga Safari skriptning kompilyatsiya
# natijasini ham keshlaydi.
#
# YANGI VERSIYA CHIQARGANDA: HTML'dagi havolaning oxiridagi raqamni
# (?v=68) oshiring — manzil o'zgargani uchun brauzer yangi nusxani
# oladi, eski keshdan emas.
# TARTIB MUHIM (V144): bu UMUMIY qoida aniq fayllardan OLDIN turadi.
# Netlify mos keladigan qoidalarni ketma-ket qo'llaydi, shuning uchun
# aniq fayl qoidasi (app.js, panel.js, panel.css) KEYIN turib, umumiy
# qiymatni almashtiradi. Agar tartib teskari bo'lsa, umumiy qoida
# aniqlarining ustiga yozilib, bir yillik kesh 30 kunga tushib
# qolardi — ko'zga ko'rinmaydigan, lekin trafik (ya'ni kredit)
# yeydigan xato.
#
# Rasm, belgi va ovoz fayllari — 30 kun (ilgari 1 soat edi).
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=2592000"

[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

[[headers]]
  for = "/assets/panel.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/panel.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# MIJOZ SAYTINING MANTIQ FAYLI — BIR YILGA (V144).
#
# NEGA BU QO'SHILDI. `app.js` 380 KB — saytdagi eng katta fayl. U
# `/assets/*` qoidasiga tushib, atigi BIR SOATGA keshlanardi. Ya'ni
# mijoz kuniga besh marta kirsa, 380 KB ni besh marta qayta yuklardi.
#
# Netlify'da trafik KREDIT yeydi (1 GB = 20 kredit), shuning uchun bu
# bevosita pul edi. `panel.js` allaqachon bir yilga keshlanardi —
# `app.js` esa e'tibordan chetda qolgan ekan.
#
# XAVFSIZMI? HA, chunki havolada versiya bor: `app.js?v=144`. Yangi
# versiya chiqarilganda raqam oshadi, manzil o'zgaradi va brauzer
# yangi nusxani oladi. Eski manzil esa o'zgarmasligi KAFOLATLANGAN.
#
# !!! DIQQAT: `assets/app.js` ni o'zgartirsangiz, `index.html` dagi
# `?v=` raqamini ALBATTA oshiring. Aks holda mijozlarda eski nusxa
# qolib ketadi. (Bir xil qoida `panel.js` uchun ham amal qiladi.)
# MIJOZ SAYTINING USLUB FAYLI — BIR YILGA (V146).
# Ilgari bu 170 KB uslub `index.html` ICHIDA edi va har tashrifda
# qaytadan yuklanardi (HTML keshlanmaydi va keshlanmasligi kerak).
# Endi alohida fayl va havolada versiya bor: `sayt.css?v=146`.
# !!! Faylni o'zgartirsangiz `index.html` dagi `?v=` ni oshiring.
[[headers]]
  for = "/assets/sayt.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/app.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"


# XAVFSIZLIK: admin panel manzili endi taxmin qilib bo'lmaydigan, tasodifiy
# nomda joylashgan (index.html yoki boshqa hech qanday sahifada unga
# havola YO'Q). Qo'shimcha ehtiyot chorasi sifatida qidiruv tizimlari
# (Google va h.k.) uni HECH QACHON indekslamasligi/ko'rsatmasligi uchun
# maxsus sarlavha qo'shildi. Bundan tashqari X-Frame-Options ANIQ shu
# yerda ham qayta ko'rsatilgan — admin panel hech qachon, hech qanday
# holatda boshqa sahifaning <iframe> ichida ochilmasligi ("clickjacking"
# hujumi) uchun ikki karra ta'minlanadi.
[[headers]]
  for = "/sotuvchi.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-cache, must-revalidate"

# XAVFSIZLIK: barcha sahifalarga umumiy himoya sarlavhasi.
# X-Content-Type-Options = "nosniff" — brauzer serverdan kelgan
# Content-Type'ni "aql bilan taxmin qilib" o'zgartirmasin (masalan .txt
# faylni JS sifatida ishga tushirmasin) deb, ba'zi hujum turlarining
# oldini oladi. To'liq CSP (Content-Security-Policy) ATAYLAB qo'shilmadi —
# saytda ko'plab inline <script> bloklari bor, ularni buzmasdan to'g'ri CSP
# yozish uchun alohida, sinchiklab testdan o'tkazish kerak.
#
# MUHIM: X-Frame-Options = "DENY" ATAYLAB faqat admin panelga (yuqorida)
# qo'yilgan, BUTUN saytga (index.html) EMAS — chunki bu sayt Telegram
# ichida ham ochilishi mumkin, va Telegram Web (web.telegram.org)
# sahifani HAQIQIY <iframe> ichida ko'rsatadi. Agar bosh sahifaga ham
# X-Frame-Options: DENY qo'yilsa, Telegram orqali ochilganda sahifa
# OCHILMAY QOLAR EDI (oq ekran) — bu haqiqiy, sinovdan o'tgan cheklov.
#
# V120: alohida "Mini ilova" sahifasi (telegram-ilova.html) VAQTINCHA
# olib tashlandi (mijoz so'rovi). Quyidagi `frame-ancestors` ruxsati esa
# ATAYLAB QOLDIRILDI — u faqat Telegram domenlariga berilgan (boshqa hech
# kim saytni <iframe> ichiga sola olmaydi), va ilova qaytarilganda hech
# narsa sozlash kerak bo'lmaydi.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # Brauzer saytimizni FAQAT HTTPS orqali ochsin. Bir marta kirgandan
    # keyin "http://" yozilsa ham brauzer o'zi HTTPS'ga o'tadi — ya'ni
    # ochiq (shifrlanmagan) ulanish umuman bo'lmaydi. Bu umumiy Wi-Fi'da
    # trafikni o'qib/o'zgartirib qo'yish hujumining oldini oladi.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Mijoz bizning saytdan boshqa saytga o'tganda, u sayt mijoz QAYSI
    # raqam sahifasida bo'lganini bilmaydi — faqat domen nomini ko'radi.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Saytga kerak bo'lmagan qurilma imkoniyatlari butunlay o'chirilgan —
    # biror skript (yoki reklama qo'shimchasi) ularni so'ray olmaydi.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # ================= CSP (Content-Security-Policy) =================
    # Nima beradi: agar biror yo'l bilan sahifaga BEGONA skript qo'shib
    # qo'yishsa ham (XSS), brauzer uni ISHGA TUSHIRMAYDI — chunki faqat
    # quyida sanab o'tilgan manbalardan skript yuklashga ruxsat bor.
    # Shuningdek: begona saytga forma yuborish, <base> bilan havolalarni
    # o'g'irlash va Flash/applet kabi plaginlar butunlay taqiqlanadi.
    #
    # 'unsafe-inline' ATAYLAB qoldirilgan: saytning o'z mantig'i inline
    # <script> bloklarida (bitta fayl — tez ochilishi uchun). Shu sabab
    # CSP bu yerda "inline skriptni to'xtatuvchi" emas, "begona
    # manbalarni to'suvchi" qatlam sifatida ishlaydi — ya'ni hujumchi
    # o'z serveridagi skriptni ulay olmaydi va o'g'irlagan ma'lumotini
    # o'z serveriga YUBORA OLMAYDI (connect-src).
    #
    # TUZATISH (V102): `script-src`/`frame-src`/`connect-src` ro'yxatida
    # www.google.com YO'Q edi. App Check (bot himoyasi) esa reCAPTCHA
    # skriptini AYNAN shu manzildan yuklaydi va <iframe> ochadi. Ya'ni
    # CSP uni har qanday qurilmada to'sib turardi — Firebase'da App Check
    # "Enforced" qilingach, bu kirishni butunlay yopdi (telefonda ham).
    # Endi reCAPTCHA manzillari ochiq, qolgan hamma narsa oldingidek yopiq.
    #
    # frame-ancestors: Telegram Mini App sifatida ochilishi uchun
    # web.telegram.org ga ruxsat (admin panel va sotuvchi kabineti esa
    # yuqorida X-Frame-Options: DENY bilan butunlay yopilgan).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://www.google.com https://www.recaptcha.net https://api-maps.yandex.ru https://mc.yandex.ru https://yastatic.net https://telegram.org https://*.telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://www.google.com https://www.gstatic.com https://www.recaptcha.net https://*.googleapis.com https://*.firebaseio.com https://*.firebaseinstallations.googleapis.com https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://firebaseappcheck.googleapis.com https://api-maps.yandex.ru https://*.maps.yandex.net https://mc.yandex.ru https://yandex.uz; frame-src 'self' https://www.google.com https://www.recaptcha.net https://*.yandex.ru https://*.yandex.uz; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; upgrade-insecure-requests"


# ==================================================================
# TARTIB MUHIM (V190). Admin panel sarlavhalari ATAYLAB faylning
# ENG OXIRIDA — ya'ni yuqoridagi umumiy "/*" blokidan KEYIN turadi.
# Netlify bir xil nomli sarlavha ikki joyda uchrasa, keyingi va
# aniqroq qoidani qo'llaydi. Agar bu blok yuqorida qolsa, umumiy CSP
# uni bosib ketadi va hujjat skaneri yana ishlamay qoladi.
# ==================================================================
[[headers]]
  for = "/panel-boshqaruv.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

    # ================= HUJJAT SKANERI (V190) =================
    # NEGA BU YERDA. Skaner "xato" berardi va sababi mijoz tomonida
    # EMAS edi — aynan shu faylda ikkita qoida uni bloklab turgan:
    #
    #   1) Pastdagi umumiy CSP `script-src` ro'yxatida
    #      cdnjs.cloudflare.com YO'Q edi. Brauzer OCR kutubxonasini
    #      yuklashdan BOSH TORTARDI — shuning uchun "kutubxona
    #      yuklanmadi" degan xato chiqardi.
    #   2) Umumiy `Permissions-Policy` da `camera=()` — ya'ni kamera
    #      BUTUNLAY taqiqlangan. Skanerning "Kamera" tugmasi hech
    #      qachon ishlay olmasdi.
    #
    # Ikkalasi ham to'g'ri qoidalar edi — faqat ular BUTUN saytga
    # qo'yilgan. Endi istisno FAQAT SHU SAHIFAGA beriladi: mijoz
    # sayti avvalgidek qattiq himoyada qoladi (kamerasiz, cdnjs'siz).
    #
    # Nega aynan shu uchta manba:
    #   cdnjs.cloudflare.com      — tesseract.min.js (kutubxonaning o'zi)
    #   cdn.jsdelivr.net          — tesseract-core.wasm (hisoblash yadrosi)
    #   tessdata.projectnaptha.com— eng.traineddata (harflar modeli)
    # `blob:` esa kutubxona o'z ishchisini (worker) shu ko'rinishda
    # yaratadi — usiz o'qish ishga tushmaydi.
    Permissions-Policy = "camera=(self), microphone=(), geolocation=(), payment=(), usb=()"
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' blob: https://www.gstatic.com https://www.google.com https://www.recaptcha.net https://cdnjs.cloudflare.com https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; media-src 'self' blob: data:; connect-src 'self' blob: data: https://www.google.com https://www.gstatic.com https://www.recaptcha.net https://*.googleapis.com https://*.firebaseio.com https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://firebaseappcheck.googleapis.com https://cdnjs.cloudflare.com https://cdn.jsdelivr.net https://tessdata.projectnaptha.com; frame-src 'self' https://www.google.com https://www.recaptcha.net; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests"

# (Android .apk sarlavhalari hozircha olib tashlandi — ilova
# sahifasi qaytarilganda shu blok ham qaytariladi.)

# Sotuvchi kabineti — qidiruv tizimlari indekslamasin va boshqa
# sahifaning <iframe> ichida ochilmasin (clickjacking).
