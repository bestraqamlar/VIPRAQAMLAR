[build]
  command = "npm install"

# QO'SHIMCHA HIMOYA QATLAMI (2-eshik): admin panelga (panel-boshqaruv.html)
# kirishdan OLDIN, HTTP darajasida alohida login/parol so'raladi — batafsili
# izoh va sozlash yo'riqnomasi: netlify/edge-functions/admin-gate.js
[[edge_functions]]
  path = "/panel-boshqaruv.html"
  function = "admin-gate"

[functions]
  directory = "netlify/functions"
  # pdfkit shrift fayllari (.afm) — bular bo'lmasa PDF generatsiya funksiyalari
  # (shartnoma yuklab olish) xato beradi. Bu Netlify'da pdfkit ishlatishning
  # mashhur "tuzog'i" — shrift fayllari avtomatik bog'lanmaydi (bundle),
  # shu sabab bu yerda ANIQ ko'rsatib qo'yamiz.
  included_files = ["node_modules/pdfkit/js/data/*.afm"]

[functions."check-credit-payments"]
  schedule = "0 */6 * * *"

[functions."credit-excel-report"]
  schedule = "0 4 * * *"

[functions."personal-bot-reminder-check"]
  schedule = "*/5 * * * *"

# BEELINE — kamyob toifalarni (Bronze/Silver/Gold) fonda yig'ib keshlash.
#
# NEGA: Beeline ochiq API'sining javob vaqti kategoriyadagi raqam soniga
# TESKARI bog'liq (raqam kam bo'lsa — butun bazani skanerlab uzoq qidiradi).
# O'lchangan: Oddiy 0.3-0.5s, Bronze ~3s, Gold ~5s, Silver 8-9s. To'rtala
# toifani jonli so'rash 14-17 soniya oladi (ochiq API parallel so'rovni
# ko'tarmaydi — 4 ta bir vaqtda yuborilsa "JWT token invalid" qaytadi).
#
# Shu sabab uchta KAMYOB toifa shu yerda, fonda yig'iladi; mijoz qidirganda
# ular keshdan bir zumda beriladi. "Oddiy" keshlanmaydi — u allaqachon tez
# va hajmi juda katta (~36 000 raqam, Firestore 1 MB limitiga sig'maydi).
#
# Natija (o'lchangan): jonli qidiruv 14 192 ms -> 359 ms.
#
# "-background" qo'shimchasi MAJBURIY: sinxronizatsiya ~80 soniya davom
# etadi (300 so'rov), oddiy funksiya limiti esa 10 soniya. Background
# funksiyalarga Netlify 15 daqiqagacha ruxsat beradi.
#
# Har 10 daqiqada: raqamlar bazasi tez-tez o'zgarmaydi, lekin sotilgan
# raqam keshda uzoq qolib ketmasligi kerak.
#
# ESKI sync-beeline.js (dilerlik/RMS login orqali) fayli loyihada endi
# ishlatilmaydi (yangi, login talab qilmaydigan "ochiq" API bilan
# almashtirildi — qarang: lib/operators.js), lekin fayl o'zi hali
# saqlanadi, kerak bo'lib qolsa deb.
[functions."sync-beeline-background"]
  schedule = "*/10 * * * *"

[functions."personal-bot-evening-reminder"]
  schedule = "0 18 * * *"

[functions."personal-bot-morning-pdf"]
  schedule = "0 0 * * *"

[functions."personal-bot-weekly-report"]
  schedule = "0 2 * * 1"

[functions."personal-bot-monthly-report"]
  schedule = "0 2 1 * *"

[functions."personal-bot-recurring-check"]
  schedule = "0 2 * * *"

[functions."personal-bot-anomaly-check"]
  schedule = "0 16 * * *"

# XAVFSIZLIK: buyurtmasiz, soxta "band qilingan" raqamlarni har 10
# daqiqada avtomatik bo'shatadi (batafsili izoh funksiya faylida).
[functions."release-stale-reservations"]
  schedule = "*/10 * * * *"

# "Baza raqam" kuzatuvi — admin bazadan tanlagan raqamni operatorda
# muntazam qidirib turadi (batafsili izoh funksiya faylida). Har daqiqada
# ishga tushadi, lekin har bir kuzatuv faqat O'ZINING vaqti kelganda
# haqiqatan tekshiriladi (1 daqiqa / 3 daqiqa / ... / 2 soat).
[functions."number-watch-check-background"]
  schedule = "* * * * *"

# "Vazifalar" (admin dedlayn) kuzatuvi — tugashiga 5 soatdan kam qolgan
# va hali bajarilmagan har bir vazifa uchun Telegram orqali BIR MARTA
# ogohlantirish yuboradi (panel yopiq bo'lsa ham). Har 5 daqiqada tekshi-
# radi — bu darajadagi aniqlik yetarli (soatlik dedlaynlar uchun ham).
[functions."admin-tasks-check-background"]
  schedule = "*/5 * * * *"

# HTML sahifalar hech qachon ESKI (keshlangan, tekshirilmagan) nusxada
# ko'rsatilmasin — brauzer har doim serverdan eng yangi versiyani
# tasdiqlab oladi. "no-store" ATAYLAB qo'yilmagan — u orqaga/oldinga
# tugmalari va sahifalar orasida o'tishni "qattiq" qilib, ochiq turgan
# oynalar/holatni yo'qotib yuborar edi (mijozlar buni "sayt o'zi ochilib
# ketyapti" deb tushungan edi).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Rasm/logo kabi statik fayllar tez yuklanishi uchun keshlansa bo'ladi —
# ular kamdan-kam o'zgaradi.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# XAVFSIZLIK: admin panel manzili endi taxmin qilib bo'lmaydigan, tasodifiy
# nomda joylashgan (index.html yoki boshqa hech qanday sahifada unga
# havola YO'Q). Qo'shimcha ehtiyot chorasi sifatida qidiruv tizimlari
# (Google va h.k.) uni HECH QACHON indekslamasligi/ko'rsatmasligi uchun
# maxsus sarlavha qo'shildi. Bundan tashqari X-Frame-Options ANIQ shu
# yerda ham qayta ko'rsatilgan — admin panel hech qachon, hech qanday
# holatda boshqa sahifaning <iframe> ichida ochilmasligi ("clickjacking"
# hujumi) uchun ikki karra ta'minlanadi.
[[headers]]
  for = "/panel-boshqaruv.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# XAVFSIZLIK: barcha sahifalarga umumiy himoya sarlavhasi.
# X-Content-Type-Options = "nosniff" — brauzer serverdan kelgan
# Content-Type'ni "aql bilan taxmin qilib" o'zgartirmasin (masalan .txt
# faylni JS sifatida ishga tushirmasin) deb, ba'zi hujum turlarining
# oldini oladi. To'liq CSP (Content-Security-Policy) ATAYLAB qo'shilmadi —
# saytda ko'plab inline <script> bloklari bor, ularni buzmasdan to'g'ri CSP
# yozish uchun alohida, sinchiklab testdan o'tkazish kerak.
#
# MUHIM: X-Frame-Options = "DENY" ATAYLAB faqat admin panelga (yuqorida)
# qo'yilgan, BUTUN saytga (index.html) EMAS — chunki bu sayt Telegram
# "Mini ilova" (Web App) sifatida ham ochiladi, va Telegram Web
# (web.telegram.org) Mini ilovalarni HAQIQIY <iframe> ichida ko'rsatadi.
# Agar bosh sahifaga ham X-Frame-Options: DENY qo'yilsa, Telegram Web
# orqali "Mini ilova" tugmasi bosilganda sahifa OCHILMAY QOLAR EDI (oq
# ekran) — bu haqiqiy, sinovdan o'tgan Telegram cheklovi.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
