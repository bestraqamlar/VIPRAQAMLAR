[build]
  command = "npm install"

# QO'SHIMCHA HIMOYA QATLAMI (2-eshik): admin panelga (panel-boshqaruv.html)
# kirishdan OLDIN, HTTP darajasida alohida login/parol so'raladi — batafsili
# izoh va sozlash yo'riqnomasi: netlify/edge-functions/admin-gate.js
[[edge_functions]]
  path = "/panel-boshqaruv.html"
  function = "admin-gate"

[functions]
  directory = "netlify/functions"
  # pdfkit shrift fayllari (.afm) — bular bo'lmasa PDF generatsiya funksiyalari
  # (shartnoma yuklab olish) xato beradi. Bu Netlify'da pdfkit ishlatishning
  # mashhur "tuzog'i" — shrift fayllari avtomatik bog'lanmaydi (bundle),
  # shu sabab bu yerda ANIQ ko'rsatib qo'yamiz.
  # index.html — seo-number.js funksiyasi uni o'qib, har bir raqam uchun
  # <title>/tavsif/OG teglarni almashtiradi. Bu yerda ANIQ ko'rsatilmasa,
  # Netlify uni funksiya paketiga qo'shmaydi va /raqam/... sahifalari
  # bosh sahifaga yo'naltirilib qolardi.
  included_files = ["node_modules/pdfkit/js/data/*.afm", "index.html"]

[functions."seo-number"]
  # Raqam sahifalari — Google va ijtimoiy tarmoq botlari uchun
  included_files = ["index.html"]

[functions."seo-toifa"]
  # Toifa sahifalari (operator / narx / naqsh) — ular ham index.html ni o'qiydi
  included_files = ["index.html"]

# ULASHISH KARTOCHKASI — raqam rasmi. Shriftlar funksiyaning O'ZI ichida
# (base64) saqlanadi, shu sabab included_files kerak emas.
[functions."og-raqam"]
  node_bundler = "esbuild"
  external_node_modules = ["@resvg/resvg-js"]

# RAQAM TO'LOVI — eslatmalar. Har 5 daqiqada tekshiradi, chunki har
# raqam uchun eslatma VAQTI alohida belgilanadi (masalan 08:00, 10:30) —
# soatiga bir marta tekshirilsa, belgilangan vaqtdan ancha kech ketardi.
[functions."tolov-eslatma-background"]
  schedule = "*/5 * * * *"

[functions."check-credit-payments"]
  schedule = "0 */6 * * *"

[functions."credit-excel-report"]
  schedule = "0 4 * * *"

[functions."personal-bot-reminder-check"]
  schedule = "*/5 * * * *"

# BEELINE — kamyob toifalarni (Bronze/Silver/Gold) fonda yig'ib keshlash.
#
# NEGA: Beeline ochiq API'sining javob vaqti kategoriyadagi raqam soniga
# TESKARI bog'liq (raqam kam bo'lsa — butun bazani skanerlab uzoq qidiradi).
# O'lchangan: Oddiy 0.3-0.5s, Bronze ~3s, Gold ~5s, Silver 8-9s. To'rtala
# toifani jonli so'rash 14-17 soniya oladi (ochiq API parallel so'rovni
# ko'tarmaydi — 4 ta bir vaqtda yuborilsa "JWT token invalid" qaytadi).
#
# Shu sabab uchta KAMYOB toifa shu yerda, fonda yig'iladi; mijoz qidirganda
# ular keshdan bir zumda beriladi. "Oddiy" keshlanmaydi — u allaqachon tez
# va hajmi juda katta (~36 000 raqam, Firestore 1 MB limitiga sig'maydi).
#
# Natija (o'lchangan): jonli qidiruv 14 192 ms -> 359 ms.
#
# "-background" qo'shimchasi MAJBURIY: sinxronizatsiya ~80 soniya davom
# etadi (300 so'rov), oddiy funksiya limiti esa 10 soniya. Background
# funksiyalarga Netlify 15 daqiqagacha ruxsat beradi.
#
# Har 10 daqiqada: raqamlar bazasi tez-tez o'zgarmaydi, lekin sotilgan
# raqam keshda uzoq qolib ketmasligi kerak.
#
# ESKI sync-beeline.js (dilerlik/RMS login orqali) fayli loyihadan
# OLIB TASHLANDI (yangi, login talab qilmaydigan "ochiq" API bilan
# almashtirildi — qarang: lib/operators.js). Nusxasi "qoshimcha/
# ishlatilmaydi/" papkasida saqlanadi, kerak bo'lib qolsa deb.
[functions."sync-beeline-background"]
  schedule = "*/10 * * * *"

[functions."personal-bot-evening-reminder"]
  schedule = "0 18 * * *"

[functions."personal-bot-morning-pdf"]
  schedule = "0 0 * * *"

[functions."personal-bot-weekly-report"]
  schedule = "0 2 * * 1"

[functions."personal-bot-monthly-report"]
  schedule = "0 2 1 * *"

[functions."personal-bot-recurring-check"]
  schedule = "0 2 * * *"

[functions."personal-bot-anomaly-check"]
  schedule = "0 16 * * *"

# TARIF MUDDATI — har kuni 04:40 (UTC) da bir marta tekshiradi:
# tugashiga 3 kun qolganlarni ogohlantiradi, tugaganlarining
# toifalarini (VIP/Premium/Gold/Mashhur) avtomatik o'chiradi.
# Batafsil izoh funksiya faylida.
[functions."tarif-muddat-background"]
  schedule = "40 4 * * *"

# XAVFSIZLIK: buyurtmasiz, soxta "band qilingan" raqamlarni har 10
# daqiqada avtomatik bo'shatadi (batafsili izoh funksiya faylida).
[functions."release-stale-reservations"]
  schedule = "*/10 * * * *"

# "Baza raqam" kuzatuvi — admin bazadan tanlagan raqamni operatorda
# muntazam qidirib turadi (batafsili izoh funksiya faylida). Har daqiqada
# ishga tushadi, lekin har bir kuzatuv faqat O'ZINING vaqti kelganda
# haqiqatan tekshiriladi (1 daqiqa / 3 daqiqa / ... / 2 soat).
[functions."number-watch-check-background"]
  schedule = "* * * * *"

# UZEX auksion kuzatuvi — admin AI yordamchiga "shu raqam/shartlar
# chiqsa aytib ber" deyilganda yaratilgan kuzatuvlarni tekshiradi
# (batafsili izoh funksiya faylida). UZEX tashqi API'siga kam-kam
# murojaat qilish uchun har 10 daqiqada ishga tushadi (kuzatuvning o'zi
# ham o'z intervaliga qarab, tez-tez emas, navbat bilan tekshiriladi).
[functions."uzex-watch-check-background"]
  schedule = "*/10 * * * *"

# Saqlangan UZEX raqamlari — savdo tugashiga 3 soat va 1 soat qolganda
# Telegram orqali ogohlantiradi (batafsili izoh funksiya faylida). Har
# 5 daqiqada tekshiradi — bu darajadagi aniqlik yetarli.
[functions."uzex-saved-expiry-check-background"]
  schedule = "*/5 * * * *"

# "Vazifalar" (admin dedlayn) kuzatuvi — tugashiga 5 soatdan kam qolgan
# va hali bajarilmagan har bir vazifa uchun Telegram orqali BIR MARTA
# ogohlantirish yuboradi (panel yopiq bo'lsa ham). Har 5 daqiqada tekshi-
# radi — bu darajadagi aniqlik yetarli (soatlik dedlaynlar uchun ham).
[functions."admin-tasks-check-background"]
  schedule = "*/5 * * * *"

# HAVOLANI ILOVADA OCHISH (deep link) uchun kerakli fayllar.
# Apple "apple-app-site-association" faylini FAQAT "application/json"
# turida berilgan bo'lsa qabul qiladi — faylning kengaytmasi yo'q, shu
# sabab turini shu yerda ANIQ ko'rsatish shart. Batafsil izoh:
# .well-known/README-OQING.txt
[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/.well-known/assetlinks.json"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"

# Service worker (oflayn rejim) — HECH QACHON keshlanmasin, aks holda
# brauzer eski sw.js ni ushlab qolib, saytning yangi versiyasi
# foydalanuvchiga yetib bormay qoladi.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Service-Worker-Allowed = "/"

# HTML sahifalar hech qachon ESKI (keshlangan, tekshirilmagan) nusxada
# ko'rsatilmasin — brauzer har doim serverdan eng yangi versiyani
# tasdiqlab oladi. "no-store" ATAYLAB qo'yilmagan — u orqaga/oldinga
# tugmalari va sahifalar orasida o'tishni "qattiq" qilib, ochiq turgan
# oynalar/holatni yo'qotib yuborar edi (mijozlar buni "sayt o'zi ochilib
# ketyapti" deb tushungan edi).
[[headers]]
  for = "/*.html"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

[[headers]]
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, must-revalidate"

# Rasm/logo kabi statik fayllar tez yuklanishi uchun keshlansa bo'ladi —
# ular kamdan-kam o'zgaradi.
# Shriftlar — nomi hech qachon o'zgarmaydi, mazmuni ham. Bir yilga
# keshlanadi: mijoz saytga ikkinchi marta kirganda umuman qayta
# yuklamaydi.
[[headers]]
  for = "/assets/fonts/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
    Access-Control-Allow-Origin = "*"

# ADMIN PANELNING USLUB va MANTIQ fayllari — BIR YILGA keshlanadi.
#
# Ular ilgari panel-boshqaruv.html ICHIDA edi (254 KB uslub + 483 KB
# mantiq) va panel HAR ochilganda qaytadan yuklanardi — telefonda,
# ayniqsa iPhone'da, sezilarli kechikish shundan edi. HTML esa
# keshlanmaydi (unda "no-cache" turibdi, va shunday bo'lishi kerak:
# yangi versiya darhol yetib borsin).
#
# Endi bu ikki fayl alohida va "immutable" bilan keshlanadi: brauzer
# ularni BIR MARTA yuklaydi, keyin diskdan oladi. Ikkinchi ochilishda
# 737 KB umuman yuklanmaydi, ustiga Safari skriptning kompilyatsiya
# natijasini ham keshlaydi.
#
# YANGI VERSIYA CHIQARGANDA: HTML'dagi havolaning oxiridagi raqamni
# (?v=68) oshiring — manzil o'zgargani uchun brauzer yangi nusxani
# oladi, eski keshdan emas.
[[headers]]
  for = "/assets/panel.css"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/panel.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

# XAVFSIZLIK: admin panel manzili endi taxmin qilib bo'lmaydigan, tasodifiy
# nomda joylashgan (index.html yoki boshqa hech qanday sahifada unga
# havola YO'Q). Qo'shimcha ehtiyot chorasi sifatida qidiruv tizimlari
# (Google va h.k.) uni HECH QACHON indekslamasligi/ko'rsatmasligi uchun
# maxsus sarlavha qo'shildi. Bundan tashqari X-Frame-Options ANIQ shu
# yerda ham qayta ko'rsatilgan — admin panel hech qachon, hech qanday
# holatda boshqa sahifaning <iframe> ichida ochilmasligi ("clickjacking"
# hujumi) uchun ikki karra ta'minlanadi.
[[headers]]
  for = "/panel-boshqaruv.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"

# (Android .apk sarlavhalari hozircha olib tashlandi — ilova
# sahifasi qaytarilganda shu blok ham qaytariladi.)

# Sotuvchi kabineti — qidiruv tizimlari indekslamasin va boshqa
# sahifaning <iframe> ichida ochilmasin (clickjacking).
[[headers]]
  for = "/sotuvchi.html"
  [headers.values]
    X-Robots-Tag = "noindex, nofollow, noarchive"
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Cache-Control = "no-cache, must-revalidate"

# XAVFSIZLIK: barcha sahifalarga umumiy himoya sarlavhasi.
# X-Content-Type-Options = "nosniff" — brauzer serverdan kelgan
# Content-Type'ni "aql bilan taxmin qilib" o'zgartirmasin (masalan .txt
# faylni JS sifatida ishga tushirmasin) deb, ba'zi hujum turlarining
# oldini oladi. To'liq CSP (Content-Security-Policy) ATAYLAB qo'shilmadi —
# saytda ko'plab inline <script> bloklari bor, ularni buzmasdan to'g'ri CSP
# yozish uchun alohida, sinchiklab testdan o'tkazish kerak.
#
# MUHIM: X-Frame-Options = "DENY" ATAYLAB faqat admin panelga (yuqorida)
# qo'yilgan, BUTUN saytga (index.html) EMAS — chunki bu sayt Telegram
# "Mini ilova" (Web App) sifatida ham ochiladi, va Telegram Web
# (web.telegram.org) Mini ilovalarni HAQIQIY <iframe> ichida ko'rsatadi.
# Agar bosh sahifaga ham X-Frame-Options: DENY qo'yilsa, Telegram Web
# orqali "Mini ilova" tugmasi bosilganda sahifa OCHILMAY QOLAR EDI (oq
# ekran) — bu haqiqiy, sinovdan o'tgan Telegram cheklovi.
[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    # Brauzer saytimizni FAQAT HTTPS orqali ochsin. Bir marta kirgandan
    # keyin "http://" yozilsa ham brauzer o'zi HTTPS'ga o'tadi — ya'ni
    # ochiq (shifrlanmagan) ulanish umuman bo'lmaydi. Bu umumiy Wi-Fi'da
    # trafikni o'qib/o'zgartirib qo'yish hujumining oldini oladi.
    Strict-Transport-Security = "max-age=31536000; includeSubDomains; preload"
    # Mijoz bizning saytdan boshqa saytga o'tganda, u sayt mijoz QAYSI
    # raqam sahifasida bo'lganini bilmaydi — faqat domen nomini ko'radi.
    Referrer-Policy = "strict-origin-when-cross-origin"
    # Saytga kerak bo'lmagan qurilma imkoniyatlari butunlay o'chirilgan —
    # biror skript (yoki reklama qo'shimchasi) ularni so'ray olmaydi.
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=(), usb=()"
    # ================= CSP (Content-Security-Policy) =================
    # Nima beradi: agar biror yo'l bilan sahifaga BEGONA skript qo'shib
    # qo'yishsa ham (XSS), brauzer uni ISHGA TUSHIRMAYDI — chunki faqat
    # quyida sanab o'tilgan manbalardan skript yuklashga ruxsat bor.
    # Shuningdek: begona saytga forma yuborish, <base> bilan havolalarni
    # o'g'irlash va Flash/applet kabi plaginlar butunlay taqiqlanadi.
    #
    # 'unsafe-inline' ATAYLAB qoldirilgan: saytning o'z mantig'i inline
    # <script> bloklarida (bitta fayl — tez ochilishi uchun). Shu sabab
    # CSP bu yerda "inline skriptni to'xtatuvchi" emas, "begona
    # manbalarni to'suvchi" qatlam sifatida ishlaydi — ya'ni hujumchi
    # o'z serveridagi skriptni ulay olmaydi va o'g'irlagan ma'lumotini
    # o'z serveriga YUBORA OLMAYDI (connect-src).
    #
    # frame-ancestors: Telegram Mini App sifatida ochilishi uchun
    # web.telegram.org ga ruxsat (admin panel va sotuvchi kabineti esa
    # yuqorida X-Frame-Options: DENY bilan butunlay yopilgan).
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.gstatic.com https://api-maps.yandex.ru https://mc.yandex.ru https://yastatic.net https://telegram.org https://*.telegram.org; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.googleapis.com https://*.firebaseio.com https://*.firebaseinstallations.googleapis.com https://firebaseinstallations.googleapis.com https://fcmregistrations.googleapis.com https://firebaseappcheck.googleapis.com https://api-maps.yandex.ru https://*.maps.yandex.net https://mc.yandex.ru https://yandex.uz; frame-src 'self' https://*.yandex.ru https://*.yandex.uz; worker-src 'self' blob:; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'self' https://web.telegram.org https://*.telegram.org; upgrade-insecure-requests"
